services:
  - type: web
    name: gamerift-pramit-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1"
      - key: FRONTEND_URL
        value: https://gamerift-pramit-web.onrender.com
      - key: BACKEND_URL
        value: https://gamerift-pramit-api.onrender.com
      - key: JWT_EXPIRATION
        value: "3600000"
      - key: MAIL_MODE
        value: brevo
      - key: MAIL_FROM_NAME
        value: Gamerift
      - key: SSLCOMMERZ_BASE_URL
        value: https://sandbox.sslcommerz.com
      - key: SSLCOMMERZ_SANDBOX
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWD
        sync: false