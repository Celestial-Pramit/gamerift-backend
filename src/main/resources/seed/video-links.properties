# YouTube links for the seeded streams. Leave a value empty to use the generated artwork.
# Format: key=https://www.youtube.com/watch?v=VIDEO_ID   (youtu.be links work too)
# Rules for a good link: official channel, embedding allowed, not age-restricted, nothing violent or gambling.
# Test a link first: open https://www.youtube.com/embed/VIDEO_ID in the browser. If it plays, it is usable.
# After editing, set app.seed.reset=true ONCE in application-dev.yml, start the app, then set it back to false.

